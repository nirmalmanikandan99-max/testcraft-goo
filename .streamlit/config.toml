[theme]
primaryColor = "#6366F1"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F4FF"
textColor = "#1E1B2E"
font = "sans serif"

[client]
# "viewer" hides the developer toolbar & Deploy card that Community Cloud
# shows to the app owner ("minimal" still lets the cloud inject them).
toolbarMode = "viewer"

[server]
address = "0.0.0.0"
port = 8501
headless = true
